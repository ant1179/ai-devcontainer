services:
  app:
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    volumes:
      - /dev/null:/workspaces/vscode/.devcontainer/.env:ro
      - /dev/null:/workspaces/vscode/.devcontainer/ai-denylist:ro
      - /dev/null:/workspaces/vscode/.devcontainer/devcontainer.json:ro
      - /dev/null:/workspaces/vscode/.devcontainer/docker-compose.generated.yaml:ro
      - /dev/null:/workspaces/vscode/.devcontainer/docker-compose.yaml:ro
      - /dev/null:/workspaces/vscode/.devcontainer/Dockerfile:ro
      - /dev/null:/workspaces/vscode/scripts/bootstrap:ro
      - /dev/null:/workspaces/vscode/scripts/setup:ro
