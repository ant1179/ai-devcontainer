services:
  app:
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - AUDIT_WRITE
    volumes:
      - type: tmpfs
        target: /workspaces/vscode/.devcontainer
        tmpfs:
          mode: 0700
      - type: tmpfs
        target: /workspaces/vscode/scripts
        tmpfs:
          mode: 0700
