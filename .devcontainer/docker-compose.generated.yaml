services:
  app:
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - AUDIT_WRITE
      - DAC_OVERRIDE
    volumes:
      - type: tmpfs
        target: /workspaces/vscode/.devcontainer
        tmpfs:
          mode: 0700
      - type: tmpfs
        target: /workspaces/vscode/scripts
        tmpfs:
          mode: 0700
      - /dev/null:/workspaces/vscode/scripts/internal/build-image:ro
      - /dev/null:/workspaces/vscode/scripts/internal/setup-ssh-agent:ro
