services:
  app:
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: tmpfs
        target: /workspaces/vscode/.devcontainer
        tmpfs:
          mode: 0700
      - type: tmpfs
        target: /workspaces/vscode/scripts
        tmpfs:
          mode: 0700
